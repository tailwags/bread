[package]
name = "bread"
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"
authors = ["Matilde Morrone <contact@rosymati.com>"]
repository = "https://github.com/tailwags/bread"
readme = "README.md"
publish = false

[dependencies]
effie = { version = "0.2.1", features = ["log"] }
effie-log = { version = "0.2.1" }
log = { version = "0.4", default-features = false, features = [
    "release_max_level_info",
] }
linux-raw-sys = { version = "0.12.1", default-features = false, features = [
    "no_std",
    "bootparam",
    "image",
] }
blakity = "0.1.1"

[features]
default = ["config-error-firmware-setup"]
# Offer F2 (reboot into the firmware setup) on the config-error screen. Without
# it, the only way out of a broken bread.conf is the firmware's own hotkeys.
config-error-firmware-setup = []

[profile.release]
lto = true
codegen-units = 1
strip = true
trim-paths = "all"
opt-level = "z"
rustflags = ["-Zfmt-debug=none", "-Cllvm-args=-enable-machine-outliner=always"]

# Hashing big kernels/initrds is the one CPU-bound path. blakity is fastest at
# 2 (about 2x faster than at "z" or "s") and smaller there than at 3.
[profile.release.package.blakity]
opt-level = 2

[profile.bloat]
inherits = "release"
debug = true

[patch.crates-io]
# effie = { path = "../effie" }
# effie-log = { path = "../effie/log" }
# blakity = { path = "../blakity" }
